name: "LiteLLM CodeQL config"

queries:
  - uses: security-and-quality

# Known scalability-limited queries on large Python codebases:
# CodeQL builds a full data flow graph in memory. These queries trace
# sensitive data through every log call / regex pattern, causing combinatorial
# path explosion on codebases with extensive logging like LiteLLM (>2 GiB
# result sets). Excluding a query here works around a CodeQL evaluation limit;
# it does not resolve or suppress a confirmed security alert.
# Re-test periodically as CodeQL improves or the codebase refactors logging.
query-filters:
  - exclude:
      id: py/clear-text-logging-sensitive-data  # CWE-312
  # CodeQL 2.27.0 exceeds its 2 GiB result-set limit while evaluating the
  # repository-wide log-injection data-flow query. Keep the remaining Python
  # security-and-quality queries enabled until the upstream query scales.
  - exclude:
      id: py/log-injection                       # CWE-117
  - exclude:
      id: py/polynomial-redos                   # CWE-730

paths-ignore:
  - tests
  - docs
  - "**/*.md"
