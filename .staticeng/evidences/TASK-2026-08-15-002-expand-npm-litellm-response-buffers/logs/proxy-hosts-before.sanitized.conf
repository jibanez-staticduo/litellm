[proxy_host_62]
domain=litellm.staticduo.com
enabled=true
route=http://litellm:4000
ssl_forced=true
certificate_id=1
hsts_enabled=true
http2_support=true
block_exploits=true
access_list_id=0
caching_enabled=false
allow_websocket_upgrade=true
advanced_config:
# Block API documentation endpoints from public internet
# location = /docs { return 404; }
# location = /redoc { return 404; }
# location = /openapi.json { return 404; }
# location ^~ /swagger { return 404; }

# Long-running LLM requests can spend several minutes before the first token.
proxy_connect_timeout 600s;
proxy_send_timeout 600s;
proxy_read_timeout 600s;
send_timeout 600s;

